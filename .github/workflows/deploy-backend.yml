name: Deploy Backend (Spring Boot)

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  id-token: write # Essencial para autenticação segura OIDC / Workload Identity Federation

env:
  GCP_REGION: us-central1
  ARTIFACT_REPOSITORY: marketplace-repo
  SERVICE_NAME: marketplace-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Configuração do ambiente Java 21 com Cache do Gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure gradlew execution permissions
        run: chmod +x gradlew

      # 2. Execução dos testes automatizados antes de gerar o container
      - name: Run Tests
        run: ./gradlew test --no-daemon

      # 3. Autenticação Passwordless na GCP via WIF
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 4. Configuração do SDK e Autenticação no Artifact Registry
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 5. Build e Push da Imagem Imutável (Tag por Commit SHA)
      - name: Build and Push Docker Image
        id: build-image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT

      # 6. Deploy no Cloud Run injetando segredos do Secret Manager
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.build-image.outputs.IMAGE_URI }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            SPRING_DATASOURCE_URL=jdbc:postgresql://35.202.26.48:5432/marketplace_db
            SPRING_DATASOURCE_USERNAME=postgres
            SPRING_DATA_REDIS_HOST=35.202.26.48
            SPRING_DATA_REDIS_PORT=6379
            CORS_ALLOWED_ORIGINS=https://game-marketplace-509222.web.app
          secrets: |
            SPRING_DATASOURCE_PASSWORD=DB_PASSWORD:latest
            JWT_SECRET=JWT_SECRET:latest